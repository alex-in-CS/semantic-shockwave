<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pick two ideas, blow every unrelated concept away, and see the chain of stepping stones that connects them in embedding space." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%237dd3fc' stroke-width='2' opacity='.5'/%3E%3Ccircle cx='9' cy='16' r='4' fill='%23f472b6'/%3E%3Ccircle cx='23' cy='16' r='4' fill='%23facc15'/%3E%3Cpath d='M13 16h6' stroke='%23a3e635' stroke-width='2.5'/%3E%3C/svg%3E" />
    <title>Semantic Shockwave</title>
  </head>
  <body>
    <div id="graph"></div>

    <aside class="panel">
      <h1>Semantic Shockwave</h1>
      <p class="tagline">Pick two ideas. Blow everything else away. See the bridge.</p>

      <form id="controls" autocomplete="off">
        <label>From <input id="source" list="concepts" maxlength="60" placeholder="e.g. black hole" required /></label>
        <label>To <input id="target" list="concepts" maxlength="60" placeholder="e.g. jazz" required /></label>
        <datalist id="concepts"></datalist>
        <div class="buttons">
          <button type="submit" id="execute">Execute</button>
          <button type="button" id="surprise" class="ghost" title="Two random concepts">Surprise me</button>
          <button type="button" id="reset" class="ghost">Reset</button>
        </div>
      </form>

      <p id="status" role="status">Loading concept space…</p>
      <ol id="chain"></ol>
      <p id="summary" aria-live="polite"></p>
      <p class="hint" id="hint">Tip: click a node to set <em>From</em>, then another for <em>To</em>.</p>
    </aside>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
