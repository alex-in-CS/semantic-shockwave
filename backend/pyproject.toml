[project]
name = "semantic-shockwave"
version = "0.3.0"
description = "Find the chain of stepping-stone concepts between two ideas in embedding space."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sentence-transformers>=3.0",
    "torch>=2.4",
    "umap-learn>=0.5.6",
    "networkx>=3.3",
    "numpy>=1.26",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shockwave"]

# CPU-only torch: ~200 MB instead of the multi-GB CUDA build.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
