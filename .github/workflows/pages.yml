# Static demo on GitHub Pages: the concept space is precomputed here, and routing
# plus free-text embedding run in the visitor's browser. No server, no cost.
name: Pages

on:
  push:
    branches: [main]
    paths: [backend/**, frontend/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-en-v1.5
      - name: Export the concept space
        working-directory: backend
        run: |
          uv sync --frozen --no-dev
          uv run --no-sync python -m shockwave.export ../frontend/public/space.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the static frontend
        working-directory: frontend
        env:
          VITE_STATIC: "1"
        run: |
          npm ci
          npm test   # includes the JS-vs-Python Dijkstra cross-check on this export
          npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
